name: Backend checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zullo
          POSTGRES_DB: zullo
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zullo -d zullo"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.427'
      - run: dotnet test Zullo.Api.Tests/Zullo.Api.Tests.csproj -c Release
      - run: dotnet build PhotoTools/PhotoTools.csproj -c Release
      - run: bash Zullo.Api.Tests/verify-chat-postgres.sh
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build container without obsolete database or design-time startup errors
        run: |
          set -o pipefail
          docker build --progress=plain --tag zullo-staging-check:local . 2>&1 | tee /tmp/zullo-container-build.log
          python3 - <<'PYTHON'
          from pathlib import Path
          log = Path('/tmp/zullo-container-build.log').read_text()
          for message in ['GlobalTypeMapper', 'An error occurred while accessing the Microsoft.Extensions.Hosting services']:
              assert message not in log, 'Container build must resolve: ' + message
          PYTHON
      - run: python3 Zullo.Api.Tests/verify-container.py
